{{define "card"}}
<div class="card">
  <div class="card__body">
    <h3 class="card__title">{{.Title}}</h3>
    <p class="card__desc">{{.Desc}}</p>
  </div>
  <div class="card__footer">
    {{template "button" (dict "Label" .CtaLabel "Href" .CtaHref "Onclick" .CtaOnclick "Variant" (or .CtaVariant "primary") "Block" true "NewTab" .CtaNewTab)}}
  </div>
</div>
{{end}}

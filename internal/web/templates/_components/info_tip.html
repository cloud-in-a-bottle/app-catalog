{{/* An explanation parked behind an info icon: hover for pointer users, the
     button pins it open for touch and keyboard. Needs static/js/info-tip.js. */}}
{{define "info-tip"}}
<span class="info-tip">
  <button class="info-tip__toggle" type="button" aria-expanded="false"
          aria-controls="{{.ID}}" aria-label="{{.Label}}">{{template "icon" (dict "BasePath" .BasePath "Name" "info" "Size" 13)}}</button>
  <span class="info-tip__body info-tip__body--{{or .Align "start"}}" id="{{.ID}}" role="note">{{.Body}}</span>
</span>
{{end}}

[app]
name = "catalog"
version = "0.2.0"
description = "Cloud in a Bottle app discovery and one-click deployment catalog"

[runtime.container]
image = "Dockerfile"
port = 8080

[routing]
health_check = "/healthz"

[resources]
memory_mb = 1024
cpu_millicores = 500

[data]
sqlite = ["main"]
app_data = true

# The catalog uses the router-internal ``installer`` v2 service to
# deploy apps on the owner's behalf.  Granting this permission lets
# the catalog install apps whose repo_url begins with one of the
# listed prefixes.  Limited to the official GitHub source feeds by
# default; the owner can widen it from the dashboard permissions page.
[[services.v2.consumes]]
service = "github.com/cloud-in-a-bottle/cloud-in-a-bottle/services/installer"
shortname = "installer"
version = ">=0.1.0"
grants = [
  { capability = "install", repo_url_prefix = "https://github.com/" },
]
